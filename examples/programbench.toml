[runtime]
backend = "docker"
image = "replace-with-prepared-builder-image@sha256:REPLACE"
python = "python3"
timeout = 300
memory = "2g"
cpus = "2"

[agent]
argv = ["/absolute/path/to/tool-agent-wrapper", "--request", "{request}", "--response", "{response}"]
stdin_prompt = true

[pipeline]
min_kept = 8
rebuild = true

